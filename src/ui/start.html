<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="page.css">
  <style>
    body { padding: 0; }

    .home {
      width: min(640px, 92vw);
      min-height: 100vh;
      margin: 0 auto;
      padding: 72px 0 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand { text-align: center; }
    .mark { font-size: 34px; font-weight: 600; letter-spacing: -0.6px; line-height: 1.1; }
    .mark span { color: var(--dim2); }
    .tag { margin-top: 9px; color: var(--dim); font-size: 12.5px; }

    .sbox { position: relative; display: flex; align-items: center; margin-top: 30px; }
    .sbox svg {
      position: absolute;
      left: 15px;
      width: 16px;
      height: 16px;
      color: var(--dim2);
      pointer-events: none;
    }
    .sbox input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 43px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--pill);
      color: var(--txt);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: background 0.12s, border-color 0.12s;
    }
    .sbox input::placeholder { color: var(--dim2); }
    .sbox input:hover { background: var(--pill-hover); }
    .sbox input:focus { background: rgba(255, 255, 255, 0.085); border-color: var(--line2); }

    .freq { margin-top: 34px; }
    .freq h3 {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim2);
      letter-spacing: 0.7px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .ftiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px; }

    .ftile {
      position: relative;
      padding: 12px 8px 10px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ftile:hover { background: var(--pill); }
    .fdot {
      width: 40px;
      height: 40px;
      margin: 0 auto 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--pill);
      color: var(--txt);
      font-size: 15px;
      font-weight: 600;
    }
    .ftile:hover .fdot { border-color: var(--line2); }
    .fhost { font-size: 12px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fcount { margin-top: 2px; font-size: 11px; color: var(--dim2); }
    .fdel {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 7px;
      background: var(--pill-hover);
      color: var(--dim);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s, background 0.12s, color 0.12s;
    }
    .ftile:hover .fdel { opacity: 1; }
    .fdel svg { width: 11px; height: 11px; display: block; }
    .fdel:hover { background: rgba(226, 92, 92, 0.16); color: var(--bad); }

    .links { margin-top: 34px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      color: var(--dim);
      font-size: 12.5px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .links a svg { width: 14px; height: 14px; color: var(--dim2); }
    .links a:hover { background: var(--pill); color: var(--txt); border-color: var(--line2); }
    .links a:hover svg { color: var(--txt); }
  </style>
</head>
<body>
  <div class="home">
    <div class="brand">
      <div class="mark">liber<span>.net</span></div>
      <div class="tag">интернет без препятствий</div>
    </div>
    <form id="f">
      <div class="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input name="q" type="text" placeholder="адрес или поиск" autocomplete="off" spellcheck="false">
      </div>
    </form>
    <div class="links">
      <a data-p="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История</a>
      <a data-p="dls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Загрузки</a>
      <a data-p="bms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Закладки</a>
      <a data-p="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Настройки</a>
    </div>
  </div>
  <script>
    const P = window.liberPage
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault()
      const v = e.target.q.value.trim()
      if (!v) return
      if (P) P.nav(v)
      else location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(v)
    })
    for (const a of document.querySelectorAll('.links a')) {
      a.addEventListener('click', () => { if (P) P.page(a.dataset.p) })
    }
    const XSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'
    ;(async () => {
      let list = []
      try { list = await P.freqList() } catch (_) {}
      if (!list || !list.length) return
      const wrap = document.createElement('div')
      wrap.className = 'freq'
      const h = document.createElement('h3')
      h.textContent = 'часто посещаемые'
      wrap.append(h)
      const grid = document.createElement('div')
      grid.className = 'ftiles'
      for (const d of list) {
        const t = document.createElement('div')
        t.className = 'ftile'
        const dot = document.createElement('div')
        dot.className = 'fdot'
        dot.textContent = d.host.charAt(0).toUpperCase()
        const name = document.createElement('div')
        name.className = 'fhost'
        name.textContent = d.host
        const cnt = document.createElement('div')
        cnt.className = 'fcount'
        cnt.textContent = d.count + ' посещений'
        const del = document.createElement('button')
        del.className = 'fdel'
        del.innerHTML = XSVG
        del.title = 'скрыть'
        del.addEventListener('click', ev => {
          ev.stopPropagation()
          P.freqHide(d.host)
          list = list.filter(x => x.host !== d.host)
          t.remove()
          if (!list.length) wrap.remove()
        })
        t.addEventListener('click', () => { const u = d.url; if (P) { P.nav(u) } else { location.href = u } })
        t.append(dot, name, cnt, del)
        grid.append(t)
      }
      wrap.append(grid)
      const links = document.querySelector('.links')
      links.parentNode.insertBefore(wrap, links)
    })()
  </script>
</body>
</html>
