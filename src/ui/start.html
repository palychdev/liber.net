<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Новая вкладка — Liber</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: #0b0c10;
      color: #e7e7ea;
      font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    }
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(700px 380px at 50% 8%, rgba(138, 123, 255, 0.13), transparent 70%),
        #0b0c10;
      z-index: -1;
    }
    .wrap { text-align: center; padding: 0 24px 60px; }
    .mark { font-size: 72px; font-weight: 650; letter-spacing: 0.5px; }
    .mark i { color: #8a7bff; font-style: normal; }
    .tag { margin-top: 10px; color: #8b8d97; font-size: 14.5px; }
    form { margin-top: 34px; }
    input {
      width: min(560px, 86vw);
      height: 48px;
      padding: 0 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.05);
      color: #e7e7ea;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #6d707a; }
    input:focus {
      border-color: #8a7bff;
      box-shadow: 0 0 0 4px rgba(138, 123, 255, 0.14);
    }
    .freq { margin-top: 34px; text-align: left; }
    .freq h3 { font-size: 12.5px; color: #8b8d97; margin-bottom: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
    .ftiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .ftile { border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 10px; background: rgba(255,255,255,0.03); cursor: pointer; text-align: center; transition: background 0.15s, border-color 0.15s; }
    .ftile:hover { background: rgba(255,255,255,0.08); border-color: rgba(138,123,255,0.35); }
    .fdot { width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; }
    .fhost { font-size: 13px; color: #e7e7ea; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .fcount { font-size: 11px; color: #8b8d97; }
    .fdel { float: right; opacity: 0; font-size: 13px; line-height: 1; }
    .ftile:hover .fdel { opacity: 0.7; }
    .fdel:hover { color: #ff5f56; }
    .links { margin-top: 30px; display: flex; gap: 22px; justify-content: center; }
    .links a {
      color: #8b8d97;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }
    .links a:hover { color: #8a7bff; }
    .foot { margin-top: 26px; color: #565863; font-size: 12px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="mark">Liber<i>.</i></div>
    <div class="tag">интернет без препятствий. уже включено.</div>
    <form id="f">
      <input name="q" type="text" placeholder="адрес или поиск" autocomplete="off" spellcheck="false">
    </form>
    <div class="links">
      <a data-p="hist">История</a>
      <a data-p="dls">Загрузки</a>
      <a data-p="bms">Закладки</a>
      <a data-p="settings">Настройки</a>
    </div>
    <div class="foot">liber.net</div>
  </div>
  <script>
    const P = window.liberPage
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault()
      const v = e.target.q.value.trim()
      if (!v) return
      if (P) P.nav(v)
      else location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(v)
    })
    for (const a of document.querySelectorAll('.links a')) {
      a.addEventListener('click', () => { if (P) P.page(a.dataset.p) })
    }
    ;(async () => {
      let list = []
      try { list = await P.freqList() } catch (_) {}
      const wrap = document.createElement('div')
      wrap.className = 'freq'
      const h = document.createElement('h3')
      h.textContent = 'часто посещаемые'
      wrap.append(h)
      const grid = document.createElement('div')
      grid.className = 'ftiles'
      for (const d of list) {
        const t = document.createElement('div')
        t.className = 'ftile'
        const dot = document.createElement('div')
        dot.className = 'fdot'
        let hh = 0
        for (const c of d.host) hh = ((hh << 5) - hh + c.charCodeAt(0)) | 0
        dot.style.background = 'hsl(' + (Math.abs(hh) % 360) + ', 60%, 55%)'
        dot.textContent = d.host.charAt(0).toUpperCase()
        const name = document.createElement('div')
        name.className = 'fhost'
        name.textContent = d.host
        const cnt = document.createElement('div')
        cnt.className = 'fcount'
        cnt.textContent = d.count + ' посещений'
        const del = document.createElement('button')
        del.className = 'fdel'
        del.textContent = '✕'
        del.title = 'скрыть'
        del.addEventListener('click', ev => {
          ev.stopPropagation()
          P.freqHide(d.host)
          list = list.filter(x => x.host !== d.host)
          t.remove()
          if (!list.length) wrap.remove()
        })
        t.addEventListener('click', () => { const u = d.url; if (P) { P.nav(u) } else { location.href = u } })
        t.append(dot, name, cnt, del)
        grid.append(t)
      }
      wrap.append(grid)
      const links = document.querySelector('.links')
      if (links) links.parentNode.insertBefore(wrap, links)
    })()
  </script>
</body>
</html>
