<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>История</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="wrap">
    <h2>История</h2>
    <div class="sub">записывается только http/https</div>
    <input id="q" class="searchbox" placeholder="поиск по истории" spellcheck="false">
    <div class="row">
      <button id="clr" class="btn danger">очистить всё</button>
    </div>
    <div id="list"></div>
  </div>
  <script>
    const listEl = document.getElementById('list')
    const qEl = document.getElementById('q')
    const P = window.liberPage
    let all = []

    function clock(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    }

    function dayLabel(ts) {
      const d = new Date(ts)
      const td = new Date()
      const yd = new Date(td.getTime() - 86400000)
      if (d.toDateString() === td.toDateString()) return 'сегодня'
      if (d.toDateString() === yd.toDateString()) return 'вчера'
      return d.toLocaleDateString([], { day: 'numeric', month: 'long' })
    }

    function dayKey(ts) {
      const d = new Date(ts)
      return d.getFullYear() + '.' + d.getMonth() + '.' + d.getDate()
    }

    function rowOf(it) {
      const d = document.createElement('div')
      d.className = 'item'
      const tx = document.createElement('div')
      tx.className = 'tx'
      const a = document.createElement('a')
      a.href = it.url
      a.textContent = it.title || it.url
      const u = document.createElement('div')
      u.className = 'u'
      u.textContent = it.url
      tx.append(a, u)
      const w = document.createElement('span')
      w.className = 'when'
      w.textContent = clock(it.date)
      const del = document.createElement('button')
      del.className = 'del'
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>'
      del.title = 'удалить'
      del.addEventListener('click', async () => {
        await P.histRemove(it.url)
        all = await P.hist()
        render()
      })
      d.append(tx, w, del)
      return d
    }

    function render() {
      const q = qEl.value.trim().toLowerCase()
      const items = q ? all.filter(it => ((it.title || '') + ' ' + it.url).toLowerCase().includes(q)) : all
      if (!items.length) {
        listEl.innerHTML = '<div class="empty">' + (all.length ? 'ничего не найдено' : 'пусто') + '</div>'
        return
      }
      const nodes = []
      let day = ''
      for (const it of items) {
        const k = dayKey(it.date)
        if (k !== day) {
          day = k
          const h = document.createElement('div')
          h.className = 'day'
          h.textContent = dayLabel(it.date)
          nodes.push(h)
        }
        nodes.push(rowOf(it))
      }
      listEl.replaceChildren(...nodes)
    }

    document.getElementById('clr').addEventListener('click', async () => {
      await P.histClear()
      all = await P.hist()
      render()
    })

    qEl.addEventListener('input', render)

    async function load() {
      all = await P.hist()
      render()
    }

    load()
  </script>
</body>
</html>
