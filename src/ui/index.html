<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Liber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bar">
    <div class="logo"><span>Liber</span><i>.</i></div>
    <div class="navc">
      <button id="back" class="icn" title="Назад">‹</button>
      <button id="reld" class="icn" title="Обновить">⟳</button>
    </div>
    <div id="tabs"></div>
    <button id="add" class="add" title="Новая вкладка">+</button>
    <div class="grow"></div>
    <button id="dls" class="dlchip" title="Загрузки (Ctrl+J)"></button>
    <span id="engine" class="dot" title="обход"></span>
    <button id="more" class="icn" title="Меню">⋮</button>
    <div id="winctl">
      <button data-m="min" class="wb">−</button>
      <button data-m="max" class="wb">▢</button>
      <button data-m="close" class="wb close">✕</button>
    </div>
  </div>
  <div id="omnirow">
    <button id="star" class="icn" title="В закладки (Ctrl+D)">☆</button>
    <div id="omniwrap">
      <span id="lock" class="lock"></span>
      <input id="omni" type="text" spellcheck="false" placeholder="адрес или поиск">
      <span id="cnt"></span>
    </div>
    <div id="sug"></div>
  </div>
  <div id="bmbar"></div>
  <div id="menu"></div>
  <div id="tmenu"></div>
  <div id="tsearch">
    <input id="tsq" type="text" placeholder="поиск по вкладкам" spellcheck="false">
    <div id="tslist"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
