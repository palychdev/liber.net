<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Режим чтения — Liber</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #12131a;
      color: #dcdce2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.75;
      padding: 48px 24px 120px;
    }
    .art { max-width: 680px; margin: 0 auto; }
    .top {
      font-family: "Segoe UI", sans-serif;
      font-size: 12.5px;
      color: #6f7280;
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }
    .top a { color: #7f83ff; text-decoration: none; }
    .top a:hover { text-decoration: underline; }
    .top button {
      padding: 6px 12px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #a9abb6;
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
    }
    .top button:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .top #back { margin-left: auto; }
    h1 { font-size: 34px; line-height: 1.25; font-weight: 600; margin-bottom: 26px; letter-spacing: -0.01em; }
    h2, h3, h4 { font-weight: 600; margin: 34px 0 12px; line-height: 1.3; }
    h2 { font-size: 25px; }
    h3 { font-size: 21px; }
    p { margin-bottom: 20px; }
    a { color: #8f9bff; }
    ul, ol { margin: 0 0 20px 26px; }
    li { margin-bottom: 8px; }
    blockquote { border-left: 3px solid rgba(255,255,255,0.15); padding-left: 18px; color: #a9abb6; font-style: italic; margin: 0 0 20px; }
    pre { background: rgba(255,255,255,0.05); padding: 14px 16px; border-radius: 10px; overflow: auto; margin-bottom: 20px; font-size: 14px; font-family: Consolas, monospace; }
    code { font-family: Consolas, monospace; font-size: 15px; }
    img { max-width: 100%; height: auto; border-radius: 10px; margin: 6px 0 20px; }
    figure { margin-bottom: 20px; }
    figcaption { font-size: 13px; color: #6f7280; font-family: "Segoe UI", sans-serif; }
    table { border-collapse: collapse; margin-bottom: 20px; font-size: 16px; }
    td, th { border: 1px solid rgba(255,255,255,0.12); padding: 6px 10px; }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.10); margin: 30px 0; }
  </style>
</head>
<body>
  <div class="art">
    <div class="top">
      <span id="host"></span>
      <a id="orig" href="#">оригинал</a>
      <button id="fs" title="размер шрифта">A</button>
      <button id="back">к странице</button>
    </div>
    <h1 id="title"></h1>
    <div id="body"></div>
  </div>
  <script>
    const P = window.liberPage
    const id = new URLSearchParams(location.search).get('id')
    let size = 19

    P.readerGet(id).then(a => {
      if (!a) {
        document.getElementById('body').textContent = 'статья не найдена'
        return
      }
      document.title = a.title + ' — режим чтения'
      document.getElementById('title').textContent = a.title
      document.getElementById('host').textContent = a.host || ''
      const o = document.getElementById('orig')
      o.addEventListener('click', ev => { ev.preventDefault(); P.newTab(a.url) })
      document.getElementById('body').innerHTML = a.html
    })

    document.getElementById('fs').addEventListener('click', () => {
      size = size >= 24 ? 17 : size + 2
      document.body.style.fontSize = size + 'px'
    })
    document.getElementById('back').addEventListener('click', () => P.readerBack())
  </script>
</body>
</html>
