<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Закладки — Liber</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="wrap">
    <h2>Закладки</h2>
    <div class="sub">☆ в адресной строке и Ctrl+D добавляют сюда</div>
    <div class="row">
      <input id="fname" class="searchbox" placeholder="название новой папки и enter" spellcheck="false">
    </div>
    <div class="row bmact">
      <button class="mini" id="bmexp">экспорт в html</button>
      <button class="mini" id="bmimp">импорт из html</button>
      <span class="hint" id="bmmsg"></span>
    </div>
    <div class="cols">
      <div class="side" id="side"></div>
      <div class="bmmain" id="list"></div>
    </div>
  </div>
  <script>
    const P = window.liberPage
    const sideEl = document.getElementById('side')
    const listEl = document.getElementById('list')
    const fnameEl = document.getElementById('fname')
    let items = []
    let folders = []
    let sel = ''

    function apply(p) {
      items = p.items || []
      folders = p.folders || []
    }

    function sideBtn(label, val, count, del) {
      const b = document.createElement('button')
      b.className = 'fbtn' + (sel === val ? ' on' : '')
      const t = document.createElement('span')
      t.textContent = label
      const c = document.createElement('span')
      c.className = 'cnt'
      c.textContent = count
      b.append(t, c)
      b.addEventListener('click', () => { sel = val; render() })
      if (del) {
        const x = document.createElement('span')
        x.className = 'x'
        x.textContent = '✕'
        x.title = 'удалить папку'
        x.addEventListener('click', async ev => {
          ev.stopPropagation()
          apply(await P.bfDel(del))
          if (sel === del) sel = ''
          render()
        })
        b.append(x)
      }
      return b
    }

    function moveSel(it) {
      const s = document.createElement('select')
      s.className = 'mini-sel'
      for (const [v, t] of [['', 'без папки'], ...folders.map(f => [f, f])]) {
        const o = document.createElement('option')
        o.value = v
        o.textContent = t
        s.append(o)
      }
      s.value = it.folder || ''
      s.addEventListener('change', async () => { apply(await P.bmMove(it.url, s.value)); render() })
      return s
    }

    function row(it) {
      const d = document.createElement('div')
      d.className = 'item'
      const tx = document.createElement('div')
      tx.className = 'tx'
      const a = document.createElement('a')
      a.href = it.url
      a.textContent = it.title || it.url
      const u = document.createElement('div')
      u.className = 'u'
      u.textContent = it.url
      tx.append(a, u)
      const del = document.createElement('button')
      del.className = 'del'
      del.textContent = '✕'
      del.addEventListener('click', async () => { apply(await P.bmRemove(it.url)); render() })
      d.append(tx, moveSel(it), del)
      return d
    }

    function render() {
      const root = items.filter(i => !i.folder)
      const nodes = [sideBtn('все закладки', '', items.length)]
      for (const f of folders) nodes.push(sideBtn(f, f, items.filter(i => i.folder === f).length, f))
      if (root.length) nodes.push(sideBtn('без папки', '~', root.length))
      sideEl.replaceChildren(...nodes)

      const list = sel === '' ? items : sel === '~' ? root : items.filter(i => i.folder === sel)
      if (!list.length) {
        listEl.innerHTML = '<div class="empty">пусто. жми ☆ на любой странице</div>'
        return
      }
      listEl.replaceChildren(...list.map(row))
    }

    fnameEl.addEventListener('keydown', async e => {
      if (e.key !== 'Enter') return
      const name = fnameEl.value.trim()
      if (!name) return
      fnameEl.value = ''
      apply(await P.bfAdd(name))
      sel = name
      render()
    })

    const msgEl = document.getElementById('bmmsg')

    document.getElementById('bmexp').addEventListener('click', async () => {
      const p = await P.bmExport()
      msgEl.textContent = p ? 'сохранено: ' + p : 'экспорт отменён'
    })

    document.getElementById('bmimp').addEventListener('click', async () => {
      const r = await P.bmImport()
      if (!r) {
        msgEl.textContent = 'импорт отменён'
        return
      }
      msgEl.textContent = 'найдено ' + r.found + ', добавлено ' + r.added + ', новых папок ' + r.folders
      apply(await P.bms())
      render()
    })

    ;(async () => { apply(await P.bms()); render() })()
  </script>
</body>
</html>
