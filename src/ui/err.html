<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>liber.net</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 92vh;
      background: #0d0e12;
      color: #e8e9ee;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code {
      color: #666974;
      font-size: 11.5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    h2 { font-size: 20px; font-weight: 600; margin: 10px 0 8px; }
    .hint { color: #8f929e; font-size: 13px; max-width: 520px; line-height: 1.6; }
    .u {
      margin: 20px auto 0;
      max-width: 640px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #8f929e;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
    }
    a.retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      height: 34px;
      padding: 0 20px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      background: #7c6ff5;
      font-size: 13px;
    }
    a.retry svg { width: 14px; height: 14px; }
    a.retry:hover { background: #8b7ff7; }
  </style>
</head>
<body>
  <div>
    <div class="code" id="code"></div>
    <h2 id="title">страница не открылась</h2>
    <div class="hint">если повторяется — канал режется сильнее обычного. попробуй позже.</div>
    <div class="u" id="url"></div>
    <a class="retry" id="retry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span id="rlabel">попробовать ещё раз</span></a>
  </div>
  <script>
    const p = new URLSearchParams(location.search)
    const u = p.get('u') || ''
    document.getElementById('code').textContent = 'ошибка ' + (p.get('c') || '')
    document.getElementById('url').textContent = u
    const r = document.getElementById('retry')
    r.href = u
    if ((p.get('c') || '') === 'crash') {
      document.getElementById('title').textContent = 'страница ушла в перегрузку'
      document.querySelector('.hint').textContent = 'вкладка не отвечала — восстанови её, нажав кнопку ниже'
      document.getElementById('rlabel').textContent = 'восстановить вкладку'
    }
  </script>
</body>
</html>
