<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ошибка</title>
  <link rel="stylesheet" href="page.css">
  <style>
    body {
      padding: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .err { width: min(520px, 88vw); }
    .code {
      color: var(--dim2);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; margin: 12px 0 10px; }
    .hint { color: var(--dim); font-size: 13px; line-height: 1.6; margin: 0 auto; max-width: 42ch; }
    .u {
      margin: 22px auto 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--dim2);
      background: var(--pill);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 14px;
      font-size: 12px;
    }
    a.retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      height: 34px;
      padding: 0 16px;
      border-radius: 9px;
      border: 1px solid var(--line2);
      background: var(--pill-hover);
      text-decoration: none;
      color: var(--txt);
      font-size: 12.5px;
      transition: background 0.12s, border-color 0.12s;
    }
    a.retry svg { width: 14px; height: 14px; color: var(--dim); }
    a.retry:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.18); }
    a.retry:hover svg { color: var(--txt); }
  </style>
</head>
<body>
  <div class="err">
    <div class="code" id="code"></div>
    <h2 id="title">страница не открылась</h2>
    <div class="hint">если повторяется — канал режется сильнее обычного. попробуй позже.</div>
    <div class="u" id="url"></div>
    <a class="retry" id="retry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span id="rlabel">попробовать ещё раз</span></a>
  </div>
  <script>
    const p = new URLSearchParams(location.search)
    const u = p.get('u') || ''
    document.getElementById('code').textContent = 'ошибка ' + (p.get('c') || '')
    document.getElementById('url').textContent = u
    const r = document.getElementById('retry')
    r.href = u
    if ((p.get('c') || '') === 'crash') {
      document.getElementById('title').textContent = 'страница ушла в перегрузку'
      document.querySelector('.hint').textContent = 'вкладка не отвечала — восстанови её, нажав кнопку ниже'
      document.getElementById('rlabel').textContent = 'восстановить вкладку'
    }
  </script>
</body>
</html>
